<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5d87ff">
  <title>Tidak ada koneksi - Gudcare</title>
  <style>
    body { margin: 0; padding: 18vh 16px 24px;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #2a3547; background: #f2f6fa; }
    .card { max-width: 420px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 32px 28px; text-align: center;
      box-shadow: rgba(145,158,171,.3) 0 0 2px 0, rgba(145,158,171,.12) 0 12px 24px -4px; }
    img { width: 56px; height: 56px; border-radius: 14px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: #5a6a85; margin: 0 0 24px; line-height: 1.6; }
    button { font: inherit; font-weight: 600; padding: 9px 20px; border-radius: 7px; border: 0; background: #5d87ff; color: #fff; cursor: pointer; }
    button:hover { background: #4570ea; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>Tidak ada koneksi internet</h1>
    <p>Data form, jawaban, dan pengiriman selalu diambil langsung dari server agar tetap terbaru. Sambungkan internet lalu coba lagi.</p>
    <button onclick="location.reload()">Coba lagi</button>
  </div>
</body>
</html>
